<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<script
type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<title>Drone AR Demo</title>

<style>

body{

margin:0;

font-family:Arial;

background:#f5f5f5;

}

.container{

max-width:1200px;

margin:auto;

padding:20px;

text-align:center;

}

model-viewer{

width:100%;

height:600px;

background:white;

}

button{

padding:15px 35px;

font-size:18px;

border:none;

border-radius:10px;

background:#0066ff;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>Drone Demo</h1>

<p>

Professional Drone Experience

</p>

<model-viewer

src="drone.glb"

camera-controls

auto-rotate

shadow-intensity="1"

ar

ar-modes="webxr scene-viewer quick-look"

>

<button slot="ar-button">

View in AR

</button>

</model-viewer>

</div>

</body>

</html>
